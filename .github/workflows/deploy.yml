name: CI/CD — ImmersWrite

on:
  push:
    branches:
      - main  # Se déclenche uniquement sur un push vers main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Build & Push les images sur DockerHub
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push — Frontend (Next.js)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: lorlaviedevdesign/immerswrite-frontend:latest

      - name: Build & Push — Backend (FastAPI)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: lorlaviedevdesign/immerswrite-backend:latest

  # ─────────────────────────────────────────────
  # JOB 2 : Déploiement sur le VPS via SSH
  # (s'exécute uniquement si le job 1 réussit)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement sur VPS OVH
    runs-on: ubuntu-latest
    needs: build-and-push  

    steps:
      - name: SSH → Pull & Restart sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/ImmersWrite
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose restart nginx
            echo "Déploiement terminé — $(date)"